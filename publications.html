<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Commit @ CSAIL — Publications</title>
  <!-- Data for this page lives in data/publications.json.
       To add a publication, append an entry to that file.
       To feature a paper, set "featured": true on its entry (award papers
       with a "price" are featured automatically). -->
  <link rel="stylesheet" href="assets/css/style.css?v=3"/>
  <!-- Umami analytics (privacy-friendly, cookieless) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="0501f709-b527-45af-8727-062721122bb4"></script>
</head>
<body>
  <div class="pagewidth">
    <div class="outer">
      <div class="main">

        <!-- HEADER / NAV -->
        <div class="menuitem nav">
          <a class="menuitemlink" href="index.html">Home</a>
          <a class="menuitemlink" href="projects.html">Projects</a>
          <a class="menuitemlink" href="people.html">People</a>
          <a class="menuitemlink" href="publications.html">Publications</a>
        </div>
        <div style="clear:both"></div>
	  <div id="image_window">

	    <img src="assets/img/commitlogo.png" alt="The COMMIT Group">
	  </div>
        <div class="secbody" id="pubs-secbody">



          <!-- FILTERS -->
          <h2 class="grouphead">Filters</h2>

          <div id="pubs-filters" class="pubs-filters">
            <div class="filter-row">
<label><input type="radio" name="mode" value="noninteractive" > Non-interactive</label>
<label><input type="radio" name="mode" value="interactive" checked> Interactive</label>
              &nbsp;&nbsp;
              <button id="btn-toggle-summaries" type="button" class="btn" aria-pressed="false">Show summaries</button>
              &nbsp;&nbsp;
              <button id="btn-clear" type="button" class="btn">Clear filters</button>
	      &nbsp;&nbsp;
	      <button id="btn-export-bib" type="button" class="btn">Export .bib</button>
	      <div class="sort-multilevel">
  <span class="sort-label">Group & sort:</span>
  <label>1
    <select id="sort-1">
        <option value="none">None</option>
      <option value="year" selected>Year</option>
      <option value="citations">Citations</option>
      <option value="month">Month</option>
      <option value="keywords">Topics &amp; Projects</option>
      <option value="authors">Authors</option>
      <option value="authorLast">First author (last name)</option>
      <option value="authorFirst">First author (first name)</option>
      <option value="type">Type</option>
    </select>
  </label>
  <label>2
    <select id="sort-2">
        <option value="none">None</option>
      <option value="citations">Citations</option>
      <option value="month" selected>Month</option>
      <option value="keywords">Topics &amp; Projects</option>
      <option value="authors">Authors</option>
      <option value="authorLast">First author (last name)</option>
      <option value="authorFirst">First author (first name)</option>
      <option value="type">Type</option>
      <option value="year">Year</option>
    </select>
  </label>
  <label>3
    <select id="sort-3">
        <option value="none">None</option>
      <option value="citations">Citations</option>
      <option value="authors">Authors</option>
      <option value="authorLast">First author (last name)</option>
      <option value="authorFirst">First author (first name)</option>
      <option value="type" selected>Type</option>
      <option value="month">Month</option>
      <option value="keywords">Topics &amp; Projects</option>
      <option value="year">Year</option>
    </select>
  </label>
  <label>4
    <select id="sort-4">
        <option value="none">None</option>
      <option value="citations">Citations</option>
      <option value="keywords">Topics &amp; Projects</option>
      <option value="authors">Authors</option>
      <option value="authorLast" selected>First author (last name)</option>
      <option value="authorFirst">First author (first name)</option>
      <option value="type">Type</option>
      <option value="month">Month</option>
      <option value="year">Year</option>
    </select>
  </label>
  <button id="sort-reset" type="button" class="btn">Reset</button>
</div>
            </div>

            <div id="filters-interactive" class="filters-interactive hidden">
              <div class="filter-block">
                <div class="filter-label">Years</div>
                <div id="facet-years" class="year-grid"></div>
              </div>

              <div class="filter-block">
                <div class="filter-label">Title search</div>
                <input id="facet-title" type="text" class="text-input" placeholder="Search title…">
              </div>

              <div class="filter-grid">
                <div class="filter-block">
                  <div class="filter-label">Topics &amp; Projects</div>
                  <div class="type-toggle" id="kw-toggle" role="group" aria-label="Filter by topic or project">
                    <button type="button" class="type-toggle-btn active" data-kwmode="topics" aria-pressed="true">Topics</button>
                    <button type="button" class="type-toggle-btn" data-kwmode="projects" aria-pressed="false">Projects</button>
                  </div>
                  <div id="facet-keywords" class="facet-list"></div>
                </div>
                <div class="filter-block">
                  <div class="filter-label">Authors</div>
                  <div class="facet-sort-control">
                    <select id="author-sort" aria-label="Sort authors by">
                      <option value="first">First</option>
                      <option value="last">Last</option>
                      <option value="count" selected># pubs</option>
                      <option value="recent">recent</option>
                    </select>
                    <input id="author-search" type="text" class="facet-search-input"
                           placeholder="Filter names…" aria-label="Filter author names">
                  </div>
                  <div id="facet-authors" class="facet-list"></div>
                </div>
                <div class="filter-block">
                  <div class="filter-label">Categories</div>
                  <div class="type-toggle" id="type-toggle" role="group" aria-label="Categorize publications by">
                    <button type="button" class="type-toggle-btn active" data-mode="type" aria-pressed="true">Type</button>
                    <button type="button" class="type-toggle-btn" data-mode="venue-name" aria-pressed="false">Venue (by Name)</button>
                    <button type="button" class="type-toggle-btn" data-mode="venue-count" aria-pressed="false">Venue (by # pubs)</button>
                  </div>
                  <div id="facet-types" class="facet-list"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- PUBLICATIONS -->
          <h2 class="grouphead">Publications <span id="pubs-count"></span></h2>
          <div id="pubs-errors" class="switchversion" style="color:#b00;"></div>
          <div id="pubs-results"></div>

        </div>

        <div class="credits">© Commit Group — Massachusetts Institute of Technology — CSAIL</div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pubs.js"></script>             <!-- for BibTeX + local URL logic -->
  <!-- v= busts stale caches: these two must always be the same vintage -->
  <script src="assets/js/citations.js?v=3"></script>    <!-- per-paper citation view (data/citations/) -->
  <script src="assets/js/publications.js?v=2"></script> <!-- the filters controller -->
</body>
</html>
